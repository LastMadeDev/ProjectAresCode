name: Ares release

# Builds the Project Ares Windows installer and publishes it as a GitHub release on this
# repository. Installed apps update from these releases (the build points electron-updater
# at GITHUB_REPOSITORY). Started by ares-sync.yml after each clean upstream merge, or by hand.
#
# Versions are 1.<UTC date>.<run number>: always increasing, and clearly not upstream's 0.x.
# Builds are unsigned until Windows signing secrets are configured (see ARES.md).

on:
  workflow_dispatch:

concurrency:
  group: ares-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check the brand layer
        run: node ares/rebrand.mjs --check

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=1.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build JS bundle
        shell: bash
        run: vp run build:desktop

      - name: Build installer
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win --target nsis --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --skip-build --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Project Ares v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-publish/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
